server:
  port: 8083

spring:
  application:
    name: apex-workflow-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:apex_nexus}
    username: ${POSTGRES_USER:apex_admin}
    password: ${POSTGRES_PASSWORD:dev_password}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SELECT set_config('app.current_user_id', '00000000-0000-0000-0000-000000000000', false)"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dev_redis_password}

jwt:
  secret: ${JWT_SECRET:dev_jwt_secret_key_change_in_production_must_be_at_least_256_bits}

springdoc:
  api-docs:
    path: /workflow/v3/api-docs
  swagger-ui:
    path: /workflow/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.apexnexus: DEBUG
    org.hibernate.SQL: WARN

# Ollama AI Configuration
ollama:
  host: ${OLLAMA_HOST:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2:1b}
