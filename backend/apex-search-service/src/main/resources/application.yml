server:
  port: 8084

spring:
  application:
    name: apex-search-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:apex_nexus}
    username: ${POSTGRES_USER:apex_admin}
    password: ${POSTGRES_PASSWORD:dev_password}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SELECT set_config('app.current_user_id', '00000000-0000-0000-0000-000000000000', false)"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dev_redis_password}

elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ES_SCHEME:http}
  index:
    documents: apex-documents
    prefix: apex-

jwt:
  secret: ${JWT_SECRET:dev_jwt_secret_key_change_in_production_must_be_at_least_256_bits}

search:
  queue-poll-interval: 5000
  batch-size: 50

springdoc:
  api-docs:
    path: /search/v3/api-docs
  swagger-ui:
    path: /search/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.apexnexus: DEBUG
