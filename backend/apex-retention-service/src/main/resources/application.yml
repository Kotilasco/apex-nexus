server:
  port: 8085

spring:
  application:
    name: apex-retention-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:apex_nexus}
    username: ${POSTGRES_USER:apex_admin}
    password: ${POSTGRES_PASSWORD:dev_password}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SELECT set_config('app.current_user_id', '00000000-0000-0000-0000-000000000000', false)"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dev_redis_password}
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

jwt:
  secret: ${JWT_SECRET:dev_jwt_secret_key_change_in_production_must_be_at_least_256_bits}

retention:
  scan-cron: "*/30 * * * * *"
  grace-period-days: 0

springdoc:
  api-docs:
    path: /retention/v3/api-docs
  swagger-ui:
    path: /retention/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.apexnexus: DEBUG
